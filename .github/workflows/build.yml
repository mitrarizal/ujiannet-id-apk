name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign APK with Release Certificate
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias ujiannetkey -keyalg RSA -keysize 2048 -validity 10000 -storepass Ujiannet2026! -keypass Ujiannet2026! -dname "CN=Ujiannet-id, OU=Education, O=Ujiannet-id, L=Indonesia, C=ID"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-key-alias ujiannetkey --ks-pass pass:Ujiannet2026! --key-pass pass:Ujiannet2026! --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release-signed.apk
