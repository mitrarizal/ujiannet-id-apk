name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Mengunci Gradle ke versi 8.5 agar tidak menggunakan Gradle 9.8.0
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # 1. Dekode Keystore Menggunakan Python
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64, re
          raw = os.environ.get('KEYSTORE_BASE64', '')
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          pad = len(clean) % 4
          if pad: clean += '=' * (4 - pad)
          with open('app/release.jks', 'wb') as f:
              f.write(base64.b64decode(clean))
          "

      # 2. Build dan Sign APK menggunakan Gradle 8.5
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      # 3. Upload file APK hasil build
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk
