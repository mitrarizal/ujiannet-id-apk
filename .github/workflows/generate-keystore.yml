name: Generate Permanent Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore, Base64, and SHA256
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=UjianNet, OU=App, O=UjianNet, L=Jakarta, ST=Jakarta, C=ID"

          base64 -w 0 release.jks > keystore_base64.txt

          keytool -list -v -keystore release.jks -storepass "$KEYSTORE_PASSWORD" | grep "SHA256:" | sed 's/.*SHA256: //' > sha256.txt

      - name: Upload Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: permanent-keystore-files
          path: |
            release.jks
            keystore_base64.txt
            sha256.txt
