name: Generate Keystore Base64

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias Key_mitra170119 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass SandiMitra170119 \
            -keypass SandiMitra170119 \
            -dname "CN=UjianNet, OU=App, O=UjianNet, L=Jakarta, ST=Jakarta, C=ID"

      - name: Convert to Base64
        run: |
          base64 -w 0 release.jks > keystore-base64.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64-file
          path: keystore-base64.txt
