# Alokasi memori RAM untuk mencegah OutOfMemoryError saat build
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
android.nonTransitiveRClass=true

# Mengaktifkan mode penuh R8 untuk pengoptimalan DEX maksimal
android.enableR8.fullMode=true
